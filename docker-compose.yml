version: '3.8'

services:
  web:
    build:
      context: .
      network: host
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./hesabixBackup:/var/www/html/hesabixBackup
      - ./hesabixArchive:/var/www/html/hesabixArchive
      - ./ssl:/etc/ssl/private
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql://hesabix_user:hesabix_password@db:3306/hesabix_db
      - APP_ENV=prod
      - APP_SECRET=${APP_SECRET:-change-this-secret-32chars-minimum}
      - DOMAIN=${DOMAIN:-localhost}
    networks:
      - hesabix-network
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=hesabix_db
      - MYSQL_USER=hesabix_user
      - MYSQL_PASSWORD=hesabix_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./hesabixBackup/databasefiles:/docker-entrypoint-initdb.d
    networks:
      - hesabix-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=hesabix_user
      - PMA_PASSWORD=hesabix_password
    depends_on:
      - db
    networks:
      - hesabix-network
    restart: unless-stopped

networks:
  hesabix-network:
    driver: bridge

volumes:
  mysql_data:
